<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f4f4f5;
      --accent: #2563eb;
      --text-muted: #e4e4e7;
      --text-dark: #71717a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --sidebar-bg: #27272a;
        --accent: #3b82f6;
        --text-muted: #3f3f46;
        --text-dark: #a1a1aa;
      }
    }

    .page-bg {
      fill: var(--bg);
      stroke: var(--text-muted);
      stroke-width: 1;
      rx: 3px;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .sidebar {
      fill: var(--sidebar-bg);
      rx: 2px;
      transition: fill 0.3s ease;
    }

    .accent-bar {
      fill: var(--accent);
      transition: fill 0.3s ease;
    }

    .line-muted {
      fill: var(--text-muted);
      transition: fill 0.3s ease;
    }

    .line-dark {
      fill: var(--text-dark);
      transition: fill 0.3s ease;
    }

    .badge {
      fill: var(--accent);
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 7px 7px;
      transition: fill 0.3s ease;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>

  <!-- Page background -->
  <rect class="page-bg" x="1" y="1" width="30" height="30" />

  <!-- Sidebar layout -->
  <rect class="sidebar" x="2" y="2" width="10" height="28" />

  <!-- Profile badge in sidebar -->
  <circle class="badge" cx="7" cy="7" r="2.5" />

  <!-- Sidebar lines -->
  <rect class="line-dark" x="4" y="13" width="6" height="1.5" rx="0.5" />
  <rect class="line-muted" x="4" y="17" width="6" height="1" rx="0.5" />
  <rect class="line-muted" x="4" y="20" width="6" height="1" rx="0.5" />
  <rect class="line-muted" x="4" y="23" width="6" height="1" rx="0.5" />

  <!-- Main section header -->
  <rect class="accent-bar" x="15" y="5" width="12" height="2" rx="0.5" />

  <!-- Main section lines -->
  <rect class="line-dark" x="15" y="10" width="14" height="1.5" rx="0.5" />
  <rect class="line-muted" x="15" y="13" width="12" height="1" rx="0.5" />
  <rect class="line-muted" x="15" y="15" width="10" height="1" rx="0.5" />

  <rect class="line-dark" x="15" y="19" width="14" height="1.5" rx="0.5" />
  <rect class="line-muted" x="15" y="22" width="13" height="1" rx="0.5" />
  <rect class="line-muted" x="15" y="24" width="11" height="1" rx="0.5" />
</svg>
