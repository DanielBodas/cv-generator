<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Deep Indigo -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Electric Cyan -->
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" /> <!-- Purple/Violet -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Premium Blue -->
    </linearGradient>

    <!-- Light Theme Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    :root {
      --bg-color: #ffffff;
      --border-color: #e4e4e7;
      --shadow-opacity: 0.1;
      --glow-color: #4f46e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a; /* Sleek Deep Slate */
        --border-color: #1e293b;
        --shadow-opacity: 0.4;
        --glow-color: #06b6d4;
      }
    }

    .bg {
      fill: var(--bg-color);
      stroke: var(--border-color);
      stroke-width: 1.5;
      rx: 8px; /* High-end rounded square */
      transition: fill 0.4s ease, stroke 0.4s ease;
    }

    .brand-shape-1 {
      fill: url(#primaryGrad);
      opacity: 0.95;
      animation: float1 4s infinite ease-in-out;
    }

    .brand-shape-2 {
      fill: url(#accentGrad);
      opacity: 0.85;
      mix-blend-mode: multiply;
      animation: float2 4s infinite ease-in-out;
    }

    @media (prefers-color-scheme: dark) {
      .brand-shape-2 {
        mix-blend-mode: screen; /* Perfect blend in dark mode */
      }
    }

    /* Modern minimalist floating animations */
    @keyframes float1 {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-0.8px) rotate(1deg);
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(0.8px) scale(0.98);
      }
    }
  </style>

  <!-- Background Card -->
  <rect class="bg" x="1.5" y="1.5" width="29" height="29" />

  <!-- Abstract Intersecting "C" and "V" geometric monogram -->
  <g transform="translate(1, 0)">
    <!-- Elegant Left Arc (representing 'C') -->
    <path class="brand-shape-1" d="M 12 7
             C 7 7, 7 25, 12 25
             C 15 25, 16 23, 16 23
             C 16 23, 14 21, 12.5 20.5
             C 10 19.5, 10.5 12, 12.5 11.5
             C 14 11, 16 9, 16 9
             C 16 9, 14.5 7, 12 7 Z" />

    <!-- Sleek Right Ribbon (representing 'V') -->
    <path class="brand-shape-2" d="M 15 7
             L 19.5 21
             L 24 7
             L 20.5 7
             L 19.5 14
             L 18.5 7
             Z" />
  </g>
</svg>
