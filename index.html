<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator & Configurator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap"
        rel="stylesheet">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/inline-editor.css">
</head>

<body>

    <div class="app-container">
        <!-- Contenedor del CV -->
        <div class="cv-viewport">
            
            <!-- Botones Flotantes (Menú Unificado) FUERA del A4 -->
            <div class="floating-actions-menu hide-on-print">
                <!-- Estructura -->
                <button id="btn-structure" title="Estructura (Ordenar Secciones)" class="dock-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>

                <!-- Ajustes Generales -->
                <button id="btn-general-settings" title="Ajustes Generales" class="dock-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>

                <div class="dock-divider"></div>

                <!-- Backups / Exportar -->
                <button id="btn-backups" title="Guardar / Cargar JSON" class="dock-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                </button>
                <input type="file" id="import-config-file" style="display: none;" accept=".json">

                <button onclick="window.print()" id="btn-print" title="Guardar como PDF (Ctrl+P)" class="dock-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                </button>
            </div>

            <!-- Modal Ajustes Generales (Oculto por defecto) -->
            <div id="general-settings-modal" class="modal hide-on-print" style="display: none;">
                <!-- Aquí inyectaremos los settings generales (colores, fuentes) -->
            </div>

            <!-- Hoja A4 pura, sin botones dentro -->
            <main id="cv-page" class="page-a4">
                <div id="loading-screen">
                    <span>Generando CV…</span>
                </div>
            </main>
        </div>
    </div>

    <script>
        function handleScriptError(scriptName) {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.innerHTML = `
                    <div style="color: #ef4444; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 30px 20px; max-width: 500px; margin: 50px auto; border: 1px solid #fee2e2; background-color: #fef2f2; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                        <h3 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 600;">❌ Error de carga</h3>
                        <p style="font-size: 14px; margin: 0 0 15px 0; color: #991b1b; line-height: 1.5;">No se pudo cargar el recurso esencial: <strong style="word-break: break-all;">${scriptName}</strong></p>
                        <p style="font-size: 12px; color: #7f1d1d; margin: 0; line-height: 1.5; opacity: 0.85;">Asegúrate de que el archivo existe en el servidor y que la compilación de Vercel ha copiado todos los recursos estáticos correctamente a la carpeta de distribución.</p>
                    </div>
                `;
            }
        }
    </script>
    <script src="jss/app.js" onerror="handleScriptError('jss/app.js')"></script>
    <script src="jss/inline-editor.js" onerror="handleScriptError('jss/inline-editor.js')"></script>
</body>

</html>
