<h2>Work Experience</h2>
<div class="experience-journey" id="journey-timeline"></div>
<div class="experience-list">
    {{#experience}}
    <div class="exp-item p-experience h-event vevent" itemprop="worksFor" itemscope itemtype="https://schema.org/Organization">
        <div class="exp-header">
            <h3 class="exp-role p-job-title" itemprop="jobTitle">{{role}}</h3>
            <span class="exp-dates p-duration" itemprop="startDate">{{dates}}</span>
        </div>
        <div class="exp-company p-org h-card" itemprop="name">{{company}}</div>
        <p class="exp-desc p-description" itemprop="description">{{description}}</p>
        <ul class="exp-tags-container" data-tags="{{tags}}">
        </ul>
        <!-- Fila compacta (visible solo en .is-minimized en pantalla, Oculta en print) -->
        <div class="exp-mini-row">
            <h3 class="exp-role">{{role}}</h3>
            <div class="exp-company">{{company}}</div>
        </div>
        <span class="exp-dates-mini">{{dates}}</span>
    </div>
    {{/experience}}
</div>
